name: recupera_tu_voz
description: AAC app — Recupera tu voz con clonación de voz privada
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.2.0
  just_audio: ^0.9.40
  http: ^1.2.1
  shared_preferences: ^2.3.2
  file_picker: ^8.0.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2
  camera: ^0.11.0
  permission_handler: ^11.3.1
  record: ^6.0.0
  google_mlkit_face_detection: ^0.13.1
  google_mlkit_commons: ^0.11.0

dev_dependencies:
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#7BBFB5"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/google_logo.png
    - assets/images/appbar.png
    - assets/data/frases_base.json
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Variable.ttf
          weight: 800